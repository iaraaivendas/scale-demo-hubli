# Nginx — proxy reverso para I.Ara Scale Demo
# Domínio: demo.vps.iarautomacoes.com.br → localhost:3000
#
# INSTALAÇÃO NO VPS (Ubuntu/Debian):
#   sudo apt install nginx -y
#   sudo cp nginx.conf /etc/nginx/sites-available/iara-scale
#   sudo ln -s /etc/nginx/sites-available/iara-scale /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (opcional, recomendado):
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d demo.vps.iarautomacoes.com.br

server {
    listen 80;
    server_name demo.vps.iarautomacoes.com.br;

    # Aumenta timeout para WebSocket
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers necessários para WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers padrão de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
